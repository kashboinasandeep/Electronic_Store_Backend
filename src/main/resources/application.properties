spring.application.name=ElectronicStoreProject

# Server
server.port=${PORT:9091}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Paths
user.profile.image.path=images/users/
product.image.path=images/products/

# Roles
admin.role.id=${ADMIN_ROLE_ID}
normal.role.id=${NORMAL_ROLE_ID}

# JWT
#jwt.secret=${JWT_SECRET
jwt.secret=${JWT_SECRET:asdogfsaogfnsanfosfhwasfnsofnsfsfosianfowehroiwgafsadfwiotbhwfsfnfwhoahwafnsfawofhwqohtwsnfsaf}
jwt.tokenValidity=${JWT_TOKENVALIDITY:18000000}

